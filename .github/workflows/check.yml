name: Check submission
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 tools/build.py
